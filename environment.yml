# Conda environment for the churn-classifier-benchmark project.
# Create with:  conda env create -f environment.yml
# Then:         conda activate churn
name: churn
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - pandas>=2.0
      - numpy>=1.24
      - scikit-learn>=1.3
      - xgboost>=2.0
      - imbalanced-learn>=0.11
      - matplotlib>=3.7
      - seaborn>=0.12
      - scipy>=1.10
      - shap>=0.44
      - jupyterlab>=4.0
      - ipykernel>=6.25
      - ipywidgets>=8.0
